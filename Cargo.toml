[package]
name = "timon"
version = "0.5.2"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Budget-aware orchestration of a lead model and bounded workers on a shared server"
repository = "https://github.com/PageDen/timon"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
ring = "0.17"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
webpki-roots = "1.0.9"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
