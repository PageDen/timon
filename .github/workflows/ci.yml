name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Timon runs on a developer's Mac, reaching the broker on a Linux host through
  # an SSH tunnel. This is the only place it is built and tested on macOS, so a
  # change that breaks the Mac shows up on the pull request rather than on a
  # developer's machine.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # Every test file, even after one fails, so a Mac-only breakage shows up
      # in one run rather than one file per round.
      - run: cargo test --no-fail-fast
